services:
  postgres:
    image: postgres:16-alpine
    container_name: cloudnote-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cloudnote
      POSTGRES_USER: cloudnote
      POSTGRES_PASSWORD: cloudnote_dev_password
    ports:
      - "5432:5432"
    volumes:
      - cloudnote_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudnote -d cloudnote"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  cloudnote_pg_data:
